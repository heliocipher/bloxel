schema_version = "1.0.0"

id = "bloxel"
version = "0.1.0"
name = "Bloxel"
tagline = "Voxel modeling inside Blender (MagicaVoxel/Goxel-style)"
maintainer = "Bloxel contributors"
type = "add-on"

blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  # hidden dot-files (.DS_Store, .git, ...)
  ".*",
  # packages built in-source
  "/*.zip",
  "dist/",
  "*.blend[1-9]",
]

[permissions]
